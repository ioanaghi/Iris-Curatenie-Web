<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with border -->
  <circle cx="60" cy="60" r="58" fill="white" stroke="#10B981" stroke-width="2"/>
  
  <!-- Iris flower icon at the top -->
  <g transform="translate(60, 25)">
    <!-- Main iris petals -->
    <path d="M0 -8C-4 -8 -8 -4 -8 0C-8 4 -4 8 0 8C4 8 8 4 8 0C8 -4 4 -8 0 -8Z" fill="#10B981" opacity="0.9"/>
    <path d="M0 -8C4 -8 8 -4 8 0C8 4 4 8 0 8C-4 8 -8 4 -8 0C-8 -4 -4 -8 0 -8Z" fill="#10B981" opacity="0.7"/>
    <path d="M0 -8C0 -12 -4 -12 -8 -8C-12 -4 -12 0 -8 4C-4 8 0 8 0 8C0 8 4 4 8 0C12 -4 12 -8 8 -12C4 -12 0 -12 0 -8Z" fill="#10B981" opacity="0.5"/>
    
    <!-- Center of iris -->
    <circle cx="0" cy="0" r="2" fill="#0F172A"/>
  </g>
  
  <!-- IRIS text -->
  <text x="60" y="55" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#0F172A">IRIS</text>
  
  <!-- CURATENIE PROFESIONALA text -->
  <text x="60" y="70" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="500" fill="#0F172A">CURATENIE PROFESIONALA</text>
  
